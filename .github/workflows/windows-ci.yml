name: Windows Native CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-windows:
    name: Windows CI (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite
      run: |
        python tests/test_suite.py

    - name: Windows PE Inspection Smoke Test
      run: |
        python src/cli.py inspect --file "C:\Windows\System32\notepad.exe"

    - name: Continuous Deobfuscation Smoke Test
      run: |
        python src/cli.py deobfuscate --hex "55 48 89 e5 31 c0 74 05 e8 11 22 33 44 90 c3"

    - name: Cross-Architecture Semantic Matching Smoke Test
      run: |
        python src/cli.py match --func1 "55 48 89 e5 89 7d fc 8b 45 fc 83 c0 01 5d c3" --func2 "55 48 89 e5 8d 47 01 5d c3"
