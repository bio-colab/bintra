[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bintra"
version = "1.1.0"
authors = [
  { name="bio-colab", email="contact@bio-colab.org" },
]
description = "Bintra — Agent-native continuous semantic reverse engineering and binary analysis framework for Windows PE/DLL binaries with 10-Sense Sensory Cortex and runtime telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "numpy>=1.24.0",
    "capstone>=5.0.0",
]

[project.scripts]
bintra = "cli:main"
bintra-cli = "cli:main"
bintra-mcp = "mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "binary_neural_engine", "bintra_engine", "sensory_cortex", "ghidra_pcode_vectorizer", "ghidra_live_bridge", "mcp_server"]

[tool.setuptools.packages.find]
where = ["src"]
