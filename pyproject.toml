[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-neural"
version = "7.4.0"
authors = [
  { name="bio-colab", email="contact@bio-colab.org" },
]
description = "Agent-native continuous semantic reverse engineering and binary analysis framework (Fork of REA for Windows PE/DLL binaries with 10-Sense Sensory Cortex)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "numpy>=1.24.0",
    "capstone>=5.0.0",
]

[project.scripts]
rea-neural = "cli:main"
reaneural = "cli:main"
rea-cli = "cli:main"
rea-mcp = "mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "binary_neural_engine", "rea_neural_engine", "sensory_cortex", "ghidra_pcode_vectorizer", "ghidra_live_bridge", "mcp_server"]

[tool.setuptools.packages.find]
where = ["src"]
