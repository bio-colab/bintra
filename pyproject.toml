[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bintra"
version = "1.1.0"
authors = [
  { name="bio-colab", email="contact@bio-colab.org" },
]
description = "Bintra — Agent-native continuous semantic reverse engineering and binary analysis framework for Windows PE/DLL binaries with 10-Sense Sensory Cortex and runtime telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "numpy>=1.24.0",
    "capstone>=5.0.0",
]

[project.scripts]
bintra = "cli:main"
bintra-cli = "cli:main"
bintra-mcp = "mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["analysis_orchestrator", "cli", "binary_neural_engine", "bintra_engine", "sensory_cortex", "ghidra_export_store", "ghidra_pcode_vectorizer", "ghidra_headless_runner", "ghidra_live_bridge", "mcp_server", "pe_deep_forensics", "python_intelligence", "python_package_intelligence", "token_telemetry"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["ruff==0.17.6"]

[tool.ruff]
target-version = "py310"
line-length = 160

[tool.ruff.lint]
# Correctness gate enforced in CI: pyflakes (undefined names, unused imports/variables,
# redefinitions) + syntax errors. Style rules are intentionally not enforced.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Tests and benchmark scripts sometimes bind values only to keep resources alive.
"tests/**" = ["F841"]
"benchmarks/**" = ["F841"]
